apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-website
  template:
    metadata:
      labels:
        app: my-website
    spec:
      containers:
        - name: my-website
          image: sujalkumar0410/my-website:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-website-service
spec:
  type: NodePort
  selector:
    app: my-website
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30008
